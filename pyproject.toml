[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-tool-use"
version = "0.1.0"
description = "MCP tool for Claude Code that routes queries through ChatGPT via browser automation"
requires-python = ">=3.10"
dependencies = [
    # ponytail: pinned below 2.0 — that release renamed FastMCP to MCPServer
    # and mcp_server.py isn't written against the new API yet.
    "mcp<2.0.0",
    "playwright",
    "markdownify",
    "json-repair",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["mcp_server", "browser", "gpt_search", "login"]

[project.scripts]
gpt-tools = "mcp_server:main"
gpt-tools-login = "login:main"
